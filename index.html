<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QSL EG9MM · Descarga de postales</title>
<meta name="description" content="Busca tu indicativo y descarga tus postcards QSL.">
<style>
  :root {
    --bg: #0e1116; --panel: #171b22; --line: #262c36; --fg: #e8ecf1;
    --muted: #96a0ae; --gold: #f5a623; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header, main, footer { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
  header { padding-top: 40px; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: .5px; }
  h1 .flag { font-size: 26px; }
  .sub { color: var(--muted); margin: 0 0 26px; font-size: 15px; }
  .search { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  input {
    flex: 1 1 340px; max-width: 460px; padding: 14px 18px; font-size: 20px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; text-transform: uppercase;
    background: var(--panel); color: var(--fg);
    border: 2px solid var(--line); border-radius: 12px; outline: none;
  }
  input:focus { border-color: var(--gold); }
  button {
    padding: 14px 20px; font-size: 15px; cursor: pointer; border-radius: 12px;
    border: 2px solid var(--line); background: var(--panel); color: var(--fg);
  }
  button.primary { background: var(--gold); color: #1a1206; border-color: var(--gold); font-weight: 700; }
  .hint { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
  .hint code { background: var(--panel); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); }
  #status { text-align: center; color: var(--muted); margin: 28px 0 8px; min-height: 22px; }
  #results { display: grid; gap: 14px; padding-bottom: 40px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 18px;
  }
  .card.exact { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
  .chead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .call { font: 700 24px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--gold); }
  .count { color: var(--muted); font-size: 13px; }
  ul.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  li.item { display: flex; gap: 14px; align-items: center; }
  .thumb {
    width: 150px; height: 100px; flex: 0 0 auto; object-fit: cover; border-radius: 8px;
    background: #0b0e13; border: 1px solid var(--line); cursor: zoom-in;
  }
  .thumb.err { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; cursor: default; }
  .meta { flex: 1 1 auto; min-width: 0; }
  .fname { font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; word-break: break-all; color: var(--fg); }
  .tag {
    display: inline-block; margin-top: 6px; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: .4px;
    background: rgba(88,166,255,.14); color: var(--accent); border: 1px solid rgba(88,166,255,.35);
  }
  .tag.rec { background: rgba(245,166,35,.14); color: var(--gold); border-color: rgba(245,166,35,.4); }
  .size { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .actions { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
  .actions a {
    padding: 8px 14px; font-size: 13px; text-decoration: none; text-align: center;
    border-radius: 9px; border: 1px solid var(--line); color: var(--fg); background: #1e242d; white-space: nowrap;
  }
  .actions a.dl { background: var(--gold); color: #1a1206; border-color: var(--gold); font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .empty code {
    display: inline-block; margin: 3px; padding: 3px 9px; border-radius: 6px;
    background: var(--panel); border: 1px solid var(--line); color: var(--gold);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px;
  }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding-bottom: 40px; border-top: 1px solid var(--line); padding-top: 18px; }
  @media (max-width: 620px) {
    .thumb { width: 108px; height: 72px; }
    li.item { flex-wrap: wrap; }
    .actions { flex-direction: row; width: 100%; }
    .actions a { flex: 1; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="flag">🇪🇸</span> QSL EG9MM · Melilla</h1>
  <p class="sub">Escribe tu indicativo / Type your Caller ID to download the QSLs</p>
  <div class="search">
    <input id="q" type="search" placeholder="EA4HJZ" autocomplete="off" autocapitalize="characters"
           spellcheck="false" aria-label="Indicativo a buscar">
    <button class="primary" id="go">Buscar</button>
    <button id="clear">Limpiar</button>
  </div>
  <p class="hint">Mínimo 4 caracteres / Minimum 4 characters. Búsqueda por inicio del nombre del archivo / Search matches start of filename.</p>
</header>

<main>
  <div id="status">Cargando índice…</div>
  <div id="results"></div>
</main>

<footer>
  <span id="updated">–</span> · <span id="total"></span><br>
  EG9MM · Melilla · 2026 · email: eg9mm.mail@gmail.com
</footer>

<script>
const THUMB = id => `https://lh3.googleusercontent.com/d/${id}=w600`;
const VIEW  = id => `https://drive.google.com/file/d/${id}/view`;
const DL    = id => `https://drive.google.com/uc?export=download&id=${id}`;

const $ = s => document.querySelector(s);
const results = $('#results'), statusEl = $('#status'), input = $('#q');
let index = null;

// Normaliza lo que escribe la persona: mayúsculas y sin espacios.
const norm = s => s.toUpperCase().replace(/[\s\-_]+/g, '');

function kb(bytes) {
  if (!bytes) return '';
  return bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + ' MB' : Math.round(bytes / 1024) + ' KB';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function itemRow(e) {
  const title = (index.activities[e.act] || {}).title || e.act;
  const isRec = e.act === 'qsl6';
  return `<li class="item">
    <img class="thumb" src="${THUMB(e.id)}" alt="Postcard QSL de ${escapeHtml(e.call)}"
         loading="lazy" onclick="window.open('${VIEW(e.id)}','_blank')"
         onerror="this.outerHTML='<div class=thumb err>sin vista previa</div>'">
    <div class="meta">
      <div class="fname">${escapeHtml(e.name)}</div>
      <span class="tag${isRec ? ' rec' : ''}">${escapeHtml(e.act.toUpperCase())} · ${escapeHtml(title)}</span>
      <div class="size">${kb(e.size)} · ${escapeHtml((e.modified || '').slice(0, 10))}</div>
    </div>
      <div class="actions">
        <a class="dl" href="${DL(e.id)}">Descargar</a>
      </div>
  </li>`;
}

// Agrupa por indicativo y ordena: coincidencia exacta primero, luego A→Z.
function render(term) {
  results.innerHTML = '';
  const t = norm(term).trim();
  if (!t || t.length < 4) {
    statusEl.textContent = index && index.total ? index.total.toLocaleString('es') + ' postcards indexadas.' : '';
    return;
  }

  const groups = new Map();
  for (const e of index.entries) {
    const prefix = norm(e.name).split('_')[0];
    if (!prefix.startsWith(t)) continue;
    if (!groups.has(e.call)) groups.set(e.call, []);
    groups.get(e.call).push(e);
  }

  if (!groups.size) {
    statusEl.textContent = `Sin resultados para "${term}".`;
    results.innerHTML = '';
    return;
  }

  const names = [...groups.keys()].sort();
  names.sort((a, b) => (a === t ? -1 : b === t ? 1 : 0));
  const files = names.reduce((n, c) => n + groups.get(c).length, 0);
  statusEl.textContent = `${names.length} indicativo(s) · ${files} postcard(s) para "${term}".`;

  for (const call of names) {
    const items = groups.get(call).sort((a, b) => a.act.localeCompare(b.act) || a.name.localeCompare(b.name));
    const div = document.createElement('div');
    div.className = 'card' + (norm(call) === t ? ' exact' : '');
    div.innerHTML = `<div class="chead"><span class="call">${escapeHtml(call)}</span>
        <span class="count">${items.length} postcard(s)</span></div>
      <ul class="items">${items.map(itemRow).join('')}</ul>`;
    results.appendChild(div);
  }
  if (names.includes(term.trim().toUpperCase())) {
    results.firstElementChild.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

async function load() {
  try {
    const res = await fetch('qsl_index.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    index = await res.json();
  } catch (err) {
    statusEl.innerHTML = `No se pudo cargar <code>qsl_index.json</code> (${escapeHtml(String(err))}).<br>
      Si abriste el fichero con doble clic, publícalo en GitHub Pages o sírvelo por HTTP.`;
    return;
  }
  $('#updated').textContent = 'Índice actualizado: ' + (index.generated_at || '?');
  $('#total').textContent = index.total.toLocaleString('es') + ' postcards en ' +
    Object.keys(index.activities || {}).length + ' actividades';
  render(input.value.trim());
  if (!input.value.trim()) input.focus();
}

let timer;
input.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => render(input.value.trim()), 120);
});
$('#go').addEventListener('click', () => render(input.value.trim()));
$('#clear').addEventListener('click', () => { input.value = ''; render(''); input.focus(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); render(input.value.trim()); } });

load();
</script>
</body>
</html>
